name = "anonboard"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# OpenNext Cloudflare Worker entrypoint and assets
main = ".open-next/worker.js"
assets = { directory = ".open-next/assets", binding = "ASSETS" }

# ── Routing ───────────────────────────────────────────────────────────────────
routes = [
  { pattern = "getnyash.com", custom_domain = true }
]

# ── D1 Database ───────────────────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "anonboard-db"
database_id = "7aea0b69-55ab-4ff7-8c18-1fa39f2a5b7b"

# ── KV Namespace (Rate Limiting) ──────────────────────────────────────────────
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "e7d850f45a6c4c50878b517c9b09c778"

# ── Public env vars (safe to commit) ─────────────────────────────────────────
[vars]
NEXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAAEM14nlnHzH8re7I"

# ── Secrets (set via CLI, never committed) ────────────────────────────────────
# wrangler pages secret put SERVER_PEPPER
# wrangler pages secret put SESSION_SECRET
# wrangler pages secret put TURNSTILE_SECRET_KEY
